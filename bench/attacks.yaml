- id: stacked_drop
  sql: SELECT 1; DROP TABLE orders
  category: stacked
  note: Benign first statement followed by DROP.
- id: stacked_delete
  sql: SELECT id FROM orders LIMIT 1; DELETE FROM orders
  category: stacked
  note: SELECT followed by DELETE.
- id: stacked_insert
  sql: SELECT 1; INSERT INTO orders (id) VALUES (9999)
  category: stacked
  note: SELECT followed by INSERT.
- id: stacked_set
  sql: SELECT 1; SET statement_timeout = 0
  category: stacked
  note: SELECT followed by disabling the session timeout.
- id: stacked_leak
  sql: SELECT id FROM customers LIMIT 1; SELECT email FROM customers
  category: stacked
  note: Allowed projection followed by a denied projection.
- id: stacked_leading
  sql: DELETE FROM orders; SELECT 1
  category: stacked
  note: Destructive first statement followed by SELECT.
- id: stacked_empty_middle
  sql: SELECT 1;; DROP TABLE products
