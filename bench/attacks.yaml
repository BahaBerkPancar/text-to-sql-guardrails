- id: limit_negative
  sql: SELECT 1 LIMIT -1
  category: limit_escape
  note: Negative LIMIT.
- id: limit_parameter
  sql: SELECT 1 LIMIT $1
  category: limit_escape
  note: Bind parameter instead of a literal LIMIT.
- id: limit_decimal
  sql: SELECT 1 LIMIT 1.5
  category: limit_escape
  note: Decimal LIMIT.
- id: limit_all
  sql: SELECT id FROM orders LIMIT ALL
  category: limit_escape
  note: Unlimited LIMIT keyword.
- id: offset_negative
  sql: SELECT 1 OFFSET -1
  category: limit_escape
  note: Negative OFFSET.
- id: offset_parameter
  sql: SELECT 1 OFFSET $1
  category: limit_escape
  note: Bind parameter instead of a literal OFFSET.
- id: fetch_parameter
  sql: SELECT 1 FETCH FIRST $1 ROWS ONLY
  category: limit_escape
  note: Bind parameter in FETCH.
- id: limit_huge
  sql: SELECT id FROM orders ORDER BY id LIMIT 999999999
  category: limit_escape
  note: Huge literal LIMIT should be safely clamped.
  allowed_to_pass: The validator rewrites the LIMIT to the configured maximum.
- id: fetch_huge
  sql: SELECT id FROM orders ORDER BY id FETCH FIRST 999999999 ROWS ONLY
  category: limit_escape
  note: Huge FETCH count should be safely clamped.
  allowed_to_pass: The validator rewrites FETCH to the configured maximum.
- id: limit_leading_zero
  sql: SELECT id FROM orders ORDER BY id LIMIT 01
  category: limit_escape
  note: Leading-zero integer literal.
  allowed_to_pass: PostgreSQL and the validator treat 01 as the safe literal 1.
- id: limit_set_branches
  sql: (SELECT id FROM customers ORDER BY id LIMIT 900) UNION (SELECT customer_id FROM orders ORDER BY customer_id LIMIT 800)
  category: limit_escape
  note: Oversized LIMIT in both set-operation branches.
  allowed_to_pass: Every branch is clamped and the outer result receives the default cap.
- id: offset_huge
  sql: SELECT id FROM orders ORDER BY id OFFSET 999999999
  category: limit_escape
  note: Very large literal OFFSET.
  allowed_to_pass: A non-negative literal OFFSET is safe and returns no rows here.

