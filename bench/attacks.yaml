- id: dos_recursive
  sql: WITH RECURSIVE bomb(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM bomb) SELECT COUNT(*) FROM bomb
  category: dos
  note: Unbounded recursive CTE.
- id: dos_orders_cube
