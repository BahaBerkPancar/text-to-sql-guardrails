- id: column_alias_email
  sql: SELECT c.email FROM customers AS c
  category: denied_column
  note: Email projected through a table alias.
- id: column_phone
  sql: SELECT phone FROM customers
  category: denied_column
  note: Direct customer phone projection.
- id: column_quoted_email
  sql: SELECT "EMAIL" FROM customers
  category: denied_column
  note: Case-folding bypass attempt with a quoted denied column.
- id: column_subquery_email
  sql: SELECT email FROM (SELECT email FROM customers) AS private_customer
  category: denied_column
  note: Denied column propagated through a derived table.
- id: column_subquery_star
  sql: SELECT * FROM (SELECT c.*, c.email FROM customers AS c) AS private_customer
  category: denied_column
  note: Denied column hidden behind derived-table star expansion.
- id: column_cte_email
