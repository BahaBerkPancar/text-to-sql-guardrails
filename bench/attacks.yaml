- id: dos_window_cartesian
  sql: SELECT COUNT(*) OVER () FROM order_items AS a CROSS JOIN orders AS b CROSS JOIN products AS c
  category: dos
  note: Full-partition window count over a hundred-million-row Cartesian product.
- id: dos_correlated
  sql: SELECT SUM(a.total + b.total + c.total) FROM orders AS a CROSS JOIN orders AS b CROSS JOIN orders AS c
