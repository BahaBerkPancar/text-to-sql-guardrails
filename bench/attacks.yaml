- id: comment_line_drop
  sql: SELECT id FROM orders -- ; DROP TABLE orders
  category: comment_trick
  note: Semicolon and DROP are only line-comment text.
  allowed_to_pass: The apparent second statement is inert comment text.
- id: comment_block_salary
  sql: SELECT id FROM orders /* UNION SELECT salary FROM staff_salaries */ ORDER BY id LIMIT 1
  category: comment_trick
  note: Denied-table text is inside a block comment.
  allowed_to_pass: The denied-table text is inert comment text.
- id: comment_block_drop
  sql: SELECT /* DROP TABLE staff_salaries */ id FROM orders ORDER BY id LIMIT 1
  category: comment_trick
  note: DDL words appear between SELECT and its projection.
  allowed_to_pass: The DDL words are inert comment text.
- id: comment_hidden_email
  sql: SELECT id /*, email */ FROM customers ORDER BY id LIMIT 1
  category: comment_trick
  note: A denied column name is commented out.
  allowed_to_pass: The denied column is not part of the parsed query.
- id: comment_nested_tokens
  sql: SELECT id FROM products /* -- ; DELETE FROM products */ ORDER BY id LIMIT 1
  category: comment_trick
  note: Line-comment and delete tokens appear inside a block comment.
  allowed_to_pass: All attack tokens are inert comment text.
- id: comment_newline_write
  sql: |-
    SELECT id FROM products
    -- DELETE FROM products
    ORDER BY id LIMIT 1
  category: comment_trick
  note: A write is hidden on a commented line.
  allowed_to_pass: The write is inert comment text.
- id: comment_unterminated
  sql: SELECT id FROM orders /* DROP TABLE orders
  category: comment_trick
  note: Unterminated comment tests fail-closed parsing.
- id: comment_close_open
  sql: SELECT id FROM orders */; DELETE FROM orders; /*
  category: comment_trick
  note: Stray comment delimiters surround a stacked write.

- id: column_email
