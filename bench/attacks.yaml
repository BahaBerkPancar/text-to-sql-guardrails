- id: column_join_star
  sql: SELECT c.*, o.* FROM customers AS c JOIN orders AS o ON o.customer_id = c.id
  category: denied_column
  note: Qualified stars on a join may expose omitted customer columns.
  allowed_to_pass: The validator expands both stars to policy-allowed columns before execution.
- id: column_where_oracle
  sql: SELECT id FROM customers WHERE email = 'customer001@example.test'
  category: denied_column
  note: Boolean oracle over a denied email.
- id: column_order_oracle
  sql: SELECT id FROM customers ORDER BY email
  category: denied_column
  note: Ordering oracle over a denied email.
- id: column_group_oracle
  sql: SELECT COUNT(*) FROM customers GROUP BY phone
  category: denied_column
  note: Grouping oracle over a denied phone number.
- id: column_case_oracle
  sql: SELECT CASE WHEN phone IS NULL THEN 0 ELSE 1 END FROM customers
