- id: column_join_phone
  sql: SELECT o.id FROM orders AS o JOIN customers AS c ON c.id = o.customer_id AND c.phone LIKE '+90%'
  category: denied_column
  note: Denied phone used only in a join condition.
- id: column_union_email
  sql: SELECT name FROM customers UNION SELECT email FROM customers
  category: denied_column
