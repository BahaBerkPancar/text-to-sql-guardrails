[project]
name = "text-to-sql-guardrails"
version = "0.1.0"
description = "Turn plain-English questions into safe, read-only PostgreSQL queries with validation guardrails."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "sqlglot>=30.31.0",
]

[project.scripts]
t2s-setup = "text_to_sql_guardrails.setup:main"

[tool.pytest.ini_options]
markers = ["pg: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
